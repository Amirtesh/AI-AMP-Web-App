name: ai-amp-backend
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # Unified environment for the AI-AMP FastAPI backend (Step 0 conclusion:
  # single service, single env — see README "Step 0" section for the diff).
  # All three per-model envs pinned python=3.11, numpy>=1.24,<2.0,
  # torch>=2.0, fair-esm>=2.0, xgboost>=2.0, scikit-learn>=1.3 with no
  # version conflicts; differences were purely additive, so this file is
  # the union of Model1/env.yml + Model2/env.yml + Generative-Model/env.yml
  # plus the FastAPI serving stack.
  - python=3.11
  - pip
  - numpy>=1.24.0,<2.0.0
  - pandas>=2.0.0
  - scipy>=1.10.0
  - scikit-learn>=1.3.0
  - xgboost>=2.0.0
  - joblib>=1.3.0
  - biopython>=1.81
  - matplotlib>=3.7.0
  - seaborn>=0.12.0
  - tqdm>=4.65.0
  - optuna>=3.5.0
  - shap>=0.44.0
  - openpyxl>=3.1.0
  - requests>=2.31.0
  - cd-hit>=4.8.1
  - pip:
    - fair-esm>=2.0.0
    - modlamp>=4.3.0
    - torch>=2.0.0
    # --- FastAPI serving stack (not in the per-model envs) ---
    - fastapi>=0.110.0
    - uvicorn[standard]>=0.29.0
    - pydantic>=2.0.0
